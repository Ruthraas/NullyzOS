# NullyzOS — terminal (kitty), config do sistema.
# Seus ajustes: Configurações → Terminal (gera ~/.config/nullyzos/kitty.conf, incluído no fim)
# ou um ~/.config/kitty/kitty.conf seu (que substitui este arquivo inteiro).

font_family      Geist Mono
font_size        11.5
disable_ligatures never

window_padding_width 12 16
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
remember_window_size no
initial_window_width  96c
initial_window_height 28c

cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.6
cursor_stop_blinking_after 15

background_opacity 0.94
dynamic_background_opacity yes

tab_bar_edge top
tab_bar_style separator
tab_separator " │ "
tab_title_template "{title}"

url_style curly
copy_on_select clipboard
strip_trailing_spaces smart

# Prompt e saudação do NullyzOS (bash); outros shells abrem normais.
shell /usr/lib/nullyzos/terminal-shell

# Cores Nullyz (escuro) — branding/tokens.json
foreground            #ededf2
background            #0e0e13
selection_foreground  #0e0e13
selection_background  #9d8cff
cursor                #9d8cff
cursor_text_color     #0e0e13
url_color             #9d8cff
active_border_color   #9d8cff
inactive_border_color #2b2b37
active_tab_foreground   #0e0e13
active_tab_background   #9d8cff
inactive_tab_foreground #a3a3b3
inactive_tab_background #17171f
tab_bar_background      #0e0e13

color0  #17171f
color8  #4a4a5a
color1  #f06a6a
color9  #ff8f8f
color2  #5fd18b
color10 #86e3a8
color3  #f0b45e
color11 #f7cb85
color4  #6e8cff
color12 #96acff
color5  #9d8cff
color13 #bcb0ff
color6  #2bb6c9
color14 #5fd0de
color7  #c8c8d4
color15 #ededf2

# Escolhas das Configurações (tema, destaque, fonte, transparência) por cima de tudo acima.
include ~/.config/nullyzos/kitty.conf
