# Constrói os pacotes de packages/ num contêiner Arch e publica o repositório pacman
# assinado "nullyzos" como assets da release "repo" (docs/REPOSITORIO.md).
# Secrets: NULLYZ_GPG_PRIVATE_KEY (chave privada armorada) e NULLYZ_GPG_KEY (fingerprint).
name: repositório pacman

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["packages/**", "branding/**", "shell/**", "hypr/**", "session/**", "apps/**", "terminal/**", "rices/**", ".github/workflows/repo.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Dependências
        run: pacman -Syu --noconfirm --needed git github-cli sudo

      - uses: actions/checkout@v4

      - name: Pacotes já publicados (reaproveitados se a versão não mudou)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p packages/prev
          gh release download repo -p '*.pkg.tar.zst' -p '*.pkg.tar.zst.sig' -D packages/prev || true
          ls packages/prev

      - name: Importa a chave GPG
        env:
          KEY: ${{ secrets.NULLYZ_GPG_PRIVATE_KEY }}
        run: |
          test -n "$KEY" || { echo "falta o secret NULLYZ_GPG_PRIVATE_KEY (docs/REPOSITORIO.md)"; exit 1; }
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder: "$GITHUB_WORKSPACE"
          printf '%s\n' "$KEY" | su builder -c 'gpg --batch --import'
          # Os pacotes do repositório local saem assinados: o pacman precisa confiar na chave.
          pacman-key --init
          pacman-key --add "$GITHUB_WORKSPACE/docs/nullyz-repo.asc"
          pacman-key --lsign-key C43C292B0901FB84D4A1A17436828706C86FB94A
          # Repositório local temporário: pacotes nossos que dependem de outros nossos (build.sh).
          printf '\n[nullyzos-local]\nSigLevel = Optional TrustAll\nServer = file://%s/packages/out\n' "$GITHUB_WORKSPACE" >> /etc/pacman.conf

      - name: Constrói e assina
        env:
          NULLYZ_GPG_KEY: ${{ secrets.NULLYZ_GPG_KEY }}
        run: su builder -c "cd '$GITHUB_WORKSPACE' && NULLYZ_GPG_KEY='$NULLYZ_GPG_KEY' packages/build.sh"

      - name: Publica na release "repo"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release view repo >/dev/null 2>&1 || gh release create repo --title "Repositório pacman do NullyzOS" --notes "Pacotes assinados pela chave Nullyz Packages. Instruções: docs/REPOSITORIO.md"
          gh release upload repo packages/out/* --clobber
