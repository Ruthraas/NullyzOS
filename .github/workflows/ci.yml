# Checagens rápidas a cada push: config Lua do Hyprland (API simulada), QML do shell e scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Config Lua do Hyprland (normal e modo VM)
        run: |
          pip install lupa
          python scripts/check-hypr.py
      - name: QML do shell
        run: python scripts/check-qml.py
      - name: Receitas de rice (#9)
        run: python scripts/check-rices.py --verificar
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning iso/build.sh packages/build.sh session/nullyzos-hyprland packages/nullyzos-installer/scripts/* shell/scripts/*.sh packages/nullyzos-sddm/fundo-login apps/limpeza apps/atualizar apps/nullyzos-rice apps/rice-root apps/nullyzos-configuracoes plasma/nullyzos-kde-primeiro plasma/nullyzos-kde-sessao packages/nullyzos-essenciais/nullyzos-flathub terminal/terminal-shell && shellcheck -S warning -s bash terminal/bashrc
