# NullyzOS: privacidade no Wi-Fi. Ao procurar redes, o endereço (MAC) muda a cada busca; em
# cada rede conectada, um endereço próprio e fixo para aquela rede (não dá para rastrear o
# aparelho entre redes diferentes, e a rede de casa continua reconhecendo).
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=preserve
