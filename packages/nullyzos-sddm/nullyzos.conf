# Tema de login do NullyzOS (pacote nullyzos-sddm). Sobrescreva em /etc/sddm.conf.d/zz-*.conf.
[Theme]
Current=nullyzos
CursorTheme=Adwaita
Font=Geist

# O greeter roda no X11 (padrão do SDDM, o mais robusto, inclusive em VM sem 3D).
# A sessão escolhida (Hyprland ou Plasma) continua sendo Wayland.
[General]
DisplayServer=x11
