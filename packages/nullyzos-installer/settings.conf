# Instalador do NullyzOS (#5): sequência do Calamares.
# Configurações de cada módulo em modules/; visual em branding/nullyzos.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: desktop
  module: packagechooser
  config: packagechooser-desktop.conf
- id: visual
  module: packagechooser
  config: packagechooser-visual.conf
- id: rede
  module: shellprocess
  config: shellprocess-rede.conf
- id: preparar
  module: shellprocess
  config: shellprocess-preparar.conf
- id: finalizar
  module: shellprocess
  config: shellprocess-finalizar.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - packagechooser@desktop
  - packagechooser@visual
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@rede
  - shellprocess@preparar
  - packages
  - shellprocess@finalizar
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - plymouthcfg
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: nullyzos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
