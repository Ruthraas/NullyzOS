---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"
# btrfs por padrão: os subvolumes (mount.conf) permitem snapshots antes de trocar de rice.
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
userSwapChoices: [ none, small ]
initialSwapChoice: none
initialPartitioningChoice: erase
luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
essentialMounts: [ "live-*", "control", "ventoy" ]
lvm:
    enable: false
