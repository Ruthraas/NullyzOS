---
# Roda dentro do sistema novo (chroot), depois do packages: Flathub + Brave e firewall.
# Pode baixar o Brave (centenas de MB): tempo generoso; falhar não para a instalação.
dontChroot: false
timeout: 1800
script:
  - command: "-/usr/lib/nullyzos-installer/finalizar-destino ${gs[packagechooser_visual]}"
    timeout: 1800
