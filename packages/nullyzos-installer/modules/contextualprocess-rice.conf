# GERADO por scripts/check-rices.py a partir de rices/*/rice.toml. Não edite à mão.
# Um comando por rice do passo Visual (chave packagechooser_visual do Calamares):
# anota o escolhido para o primeiro login. O Nullyz padrão não precisa de nada.
---
dontChroot: false
timeout: 60
packagechooser_visual:
    nullyz-areia: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-areia"
    nullyz-brasa: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-brasa"
    nullyz-cru: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-cru"
    nullyz-mono: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-mono"
    nullyz-musgo: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-musgo"
    nullyz-ouro: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-ouro"
    nullyz-papel: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-papel"
    nullyz-sol: "-/usr/lib/nullyzos-installer/rice-inicial nullyz-sol"
