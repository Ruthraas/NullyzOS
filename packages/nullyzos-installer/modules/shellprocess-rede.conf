---
# Roda no live (fora do chroot), antes do shellprocess@preparar.
# O /etc/resolv.conf do live é um link para /run/systemd/resolve, que não existe dentro do
# sistema novo durante a instalação: sem isto o pacman não resolve nenhum mirror.
# Depois de instalado, o NetworkManager reescreve o arquivo.
dontChroot: true
timeout: 30
script:
  - "cp -L --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
