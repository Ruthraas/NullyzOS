---
# /etc/default/grub do sistema novo: nome "NullyzOS" (bootloaderEntryName do branding) e
# "quiet"; o "splash" entra sozinho quando o plymouth está instalado (animação de boot).
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3", "rd.udev.log_level=3", "vt.global_cursor_default=0" ]
defaults:
    GRUB_TIMEOUT: 2
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
