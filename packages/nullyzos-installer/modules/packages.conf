---
backend: pacman
skip_if_no_internet: false
update_db: true
update_system: false
pacman:
    num_retries: 2
    disable_download_timeout: false
    needed_only: false
operations:
  # Sai o que é só do live.
  - try_remove:
    - calamares
    - cage
    - nullyzos-installer
    - archinstall
  # O kernel volta para o /boot (o archiso o tira da imagem) e entra o sistema base do NullyzOS.
  - install:
    - linux
    - linux-firmware
    - networkmanager
    - sudo
    - grub
    - efibootmgr
    - btrfs-progs
    - plymouth
    - adwaita-cursors
    - ttf-geist
    - nullyzos-branding
    - nullyzos-plymouth
    - nullyzos-sddm
