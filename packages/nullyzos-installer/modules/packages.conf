---
backend: pacman
skip_if_no_internet: false
update_db: true
update_system: false
pacman:
    num_retries: 5
    # Evita abortar em conexões reais lentas ou instáveis.
    disable_download_timeout: true
    needed_only: false
operations:
  # O que é só do live (calamares, cage, nullyzos-installer) sai no FIM, em shellprocess@limpar:
  # os scripts de finalização e do rice são deste pacote e rodam depois daqui.
  # O kernel volta para o /boot (o archiso o tira da imagem) e entra o sistema base do NullyzOS.
  - install:
    - linux
    - linux-firmware
    - networkmanager
    - sudo
    - grub
    - efibootmgr
    - btrfs-progs
    - plymouth
    - adwaita-cursors
    - ttf-geist
    - nullyzos-branding
    - nullyzos-plymouth
    - nullyzos-sddm
