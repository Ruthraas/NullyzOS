# Último passo no sistema novo: tira o que é só do live (o instalador e o que ele usa).
# Fica no fim porque finalizar-destino e rice-inicial vêm do pacote nullyzos-installer.
---
dontChroot: false
timeout: 300
script:
  - "-pacman -Rns --noconfirm nullyzos-installer calamares cage"
  - "-pacman -Rns --noconfirm archinstall"
