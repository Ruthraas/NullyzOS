---
units:
  - name: NetworkManager
    action: enable
    mandatory: true
  - name: sddm
    action: enable
    mandatory: true
  # DNS: o /etc/resolv.conf aponta para o stub do systemd-resolved; sem ele ligado o sistema
  # instalado ficava sem DNS (achado no teste). O NetworkManager conversa com ele sozinho.
  - name: systemd-resolved
    action: enable
    mandatory: true
  - name: systemd-timesyncd
    action: enable
    mandatory: false
  # Bluetooth, impressora e firewall (pacotes do nullyzos-essenciais)
  - name: bluetooth
    action: enable
    mandatory: false
  - name: cups
    action: enable
    mandatory: false
  - name: ufw
    action: enable
    mandatory: false
  # Snapshots no menu do boot (refaz o submenu do GRUB quando surge snapshot novo)
  - name: grub-btrfsd
    action: enable
    mandatory: false
  # Perfil de energia (Configurações → Desempenho: Economia / Equilibrado / Desempenho).
  - name: power-profiles-daemon
    action: enable
    mandatory: false
