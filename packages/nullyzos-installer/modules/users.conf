---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
sudoersGroup: wheel
sudoersConfigureWithGroup: true
# Root fica bloqueado; administração pelo sudo do usuário.
setRootPassword: false
doReusePassword: false
displayAutologin: false
doAutologin: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "nullyzos-${cpu}"
