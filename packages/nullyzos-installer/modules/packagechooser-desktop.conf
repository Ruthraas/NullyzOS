---
mode: required
method: packages
labels:
    step: "Desktop"
items:
    - id: hyprland
      name: "Hyprland"
      description: "Janelas lado a lado ou soltas, tudo no teclado se quiser. Mais leve e com mais rices da comunidade. Com o desktop Nullyz: barra de menus, dock e busca (Super + Espaço). Em máquina virtual, ligue a aceleração 3D (VirtualBox: Tela → Habilitar aceleração 3D); sem ela, escolha o KDE."
      screenshot: "/etc/calamares/branding/nullyzos/hyprland.png"
      packages: [ nullyzos-desktop-hyprland ]
    - id: kde
      name: "KDE Plasma"
      description: "Completo e familiar: janelas soltas, menu global, apps do KDE e muitos ajustes prontos. Com o visual Nullyz: barra em cima, dock flutuante, cores e fontes do NullyzOS."
      screenshot: "/etc/calamares/branding/nullyzos/kde.png"
      packages: [ plasma-meta, konsole, dolphin, kate, nullyzos-essenciais, nullyzos-desktop-kde ]
