# Paleta "sol" da prévia do Nullyz (todos os papéis de cor), com barra e dock próprios.
id = "nullyz-sol"
nome = "Nullyz Sol"
descricao = "Grafite com amarelo sol, contraste alto e barra flutuante."
autor = "NullyzOS"
licenca = "GPL-3.0-or-later"
origem = "https://github.com/Ruthraas/NullyzOS"
desktop = "ambos"
tipo = "preset"

[preferencias]
palette = "sol"
accent = "tema"
glassOpacity = 0.72
roundness = 1
motion = 1
barSize = "normal"
barStyle = "flutuante"
dockStyle = "vidro"
dockIndicator = "traco"
dockMagnify = 0.35
uiFont = "Geist"

[hyprland]
gaps = "normal"
rounding = 14

[kde]
colorscheme = "NullyzSol"
