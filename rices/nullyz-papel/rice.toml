# Paleta "papel" da prévia do Nullyz (todos os papéis de cor), com barra e dock próprios.
id = "nullyz-papel"
nome = "Nullyz Papel"
descricao = "Claro como papel: fundo creme, azul tinta, barra flutuante e cantos suaves."
autor = "NullyzOS"
licenca = "GPL-3.0-or-later"
origem = "https://github.com/Ruthraas/NullyzOS"
desktop = "ambos"
tipo = "preset"

[preferencias]
palette = "papel"
accent = "tema"
glassOpacity = 0.8
roundness = 1
motion = 1
barSize = "normal"
barStyle = "flutuante"
dockStyle = "solido"
dockIndicator = "traco"
dockMagnify = 0.35
uiFont = "Geist"

[hyprland]
gaps = "amplo"
rounding = 14

[kde]
colorscheme = "NullyzPapel"
